name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de las pruebas
        run: python -m pip install pytest jsonschema
      - name: Comprobar el entorno
        run: python dibujar.py --comprobar
      - name: Pruebas
        run: python -m pytest -q
      - name: Dibujar el ejemplo como lo haría una persona
        run: python dibujar.py ejemplos/pedido-a-despacho/proceso.json --no-abrir --salida salida-ci
